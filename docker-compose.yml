services:
  migrate:
    build: .
    env_file: .env.local
    command: ["node", "dist/server/db/migrate.mjs"]
    restart: "no"
  api:
    build: .
    env_file: .env.local
    environment:
      NODE_ENV: production
      RAT_HOST: 0.0.0.0
      RAT_PORT: 8787
      RAT_DATA_DIR: /app/data
    volumes:
      - rat-data:/app/data
    expose:
      - "8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10m
      timeout: 20s
      start_period: 30s
      start_interval: 5s
      retries: 3
    init: true
    restart: unless-stopped
  worker:
    build: .
    env_file: .env.local
    environment:
      NODE_ENV: production
      RAT_DATA_DIR: /app/data
    command: ["node", "dist/server/worker.mjs"]
    volumes:
      - rat-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rat-data:
  caddy-data:
  caddy-config:
